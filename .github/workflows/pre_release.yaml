name: Pre-Release: Generate CRDs & Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string

jobs:
  generate-crds:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1️⃣ Checkout main branch
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2️⃣ Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: k8s/migration/go.mod
          cache: true

      # 3️⃣ Install controller-gen
      - name: Install controller-gen
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 4️⃣ Install kustomize (stable version)
      - name: Install kustomize
        run: |
          curl -Lo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.1/kustomize_v5.4.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # 5️⃣ Run build-installer with provided tag
      - name: Run build-installer
        run: |
          cd k8s/migration
          make build-installer TAG=${{ github.event.inputs.tag }}

      # 6️⃣ Create PR automatically (only if changes exist)
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: pre-release/${{ github.event.inputs.tag }}
          base: main
          commit-message: "chore: generate CRDs and installer for ${{ github.event.inputs.tag }}"
          title: "chore: Pre-release CRD generation for ${{ github.event.inputs.tag }}"
          body: |
            This PR was automatically generated by the pre-release workflow.

            Tag: `${{ github.event.inputs.tag }}`

            It updates:
            - CRDs
            - installer.yaml
            - image tags in manifests

            Please review and merge before creating the release.
          labels: |
            release
            automated
          delete-branch: true
